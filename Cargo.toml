[workspace]
resolver = "2"
members = [
    "crates/vigil-core",
    "crates/vigil-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RARS-oss/vigil"
description = "vigil: an OWASP LLM Top-10 red-team scanner with Ed25519-signed, reproducible receipts"

[workspace.dependencies]
# vigil-core is the payload registry + target-adapter trait + receipt model (ported from bulla-core).
vigil-core = { path = "crates/vigil-core", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }

# receipt / crypto — same versions as bulla-core, since this is a direct port of its receipt model.
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
getrandom = "0.2"

# target adapters
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
